<div id="app">
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #075203;">
    <a href="#" class="navbar-brand">Principal</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto" routerLinkActive="active">
        <li class="nav-item">
          <a href="/home" class="nav-link custom-nav-link" routerLink="home">Home </a>
        </li>
        <li class="nav-item" *ngIf="showAdminBoard">
          <a href="/admin" class="nav-link custom-nav-link" routerLink="admin">Admin Board</a>
        </li>
        <li class="nav-item" *ngIf="showAdminBoard">
          <a class="nav-link custom-nav-link" routerLink="/userlist">Usuarios</a>
        </li><!--
        <li class="nav-item" *ngIf="showModeratorBoard">
          <a href="/medico" class="nav-link custom-nav-link" routerLink="medico2">Medico Board</a>
        </li>-->
        <li class="nav-item" *ngIf="showModeratorBoard || showAdminBoard">
          <a class="nav-link custom-nav-link" routerLink="/medico-list">Medicos</a>
        </li>
        <li class="nav-item" *ngIf="showModeratorBoard || showAdminBoard">
          <a class="nav-link custom-nav-link" routerLink="/paciente-list">Pacientes</a>
        </li>
        <li class="nav-item" *ngIf="showModeratorBoard || showAdminBoard">
          <a class="nav-link custom-nav-link" routerLink="/especialidadlist">Especialidad</a>
        </li>     
        <li class="nav-item" *ngIf="showModeratorBoard || showAdminBoard">
          <a class="nav-link custom-nav-link" routerLink="/medico-especialidad-list">Medico-Especialidad</a>
        </li>
        <li class="nav-item" *ngIf="showModeratorBoard || showAdminBoard">
          <a class="nav-link custom-nav-link" routerLink="/horario-list">Horario</a>
        </li>
        <li class="nav-item" *ngIf="showUserBoard || showAdminBoard || showModeratorBoard">
          <a class="nav-link custom-nav-link" routerLink="/ficha-list">Ficha</a>
        </li>
        <li class="nav-item" *ngIf="showUserBoard">
          <a href="/paciente" class="nav-link custom-nav-link" *ngIf="isLoggedIn" routerLink="paciente">Paciente Board</a>
        </li>
      </ul>

      <ul class="navbar-nav ml-auto" *ngIf="!isLoggedIn">
        <li class="nav-item">
          <a href="/register" class="nav-link custom-nav-link" routerLink="register">Registrarse</a>
        </li>
        <li class="nav-item">
          <a href="/login" class="nav-link custom-nav-link" routerLink="login">Iniciar Sesion</a>
        </li>
      </ul>

      <ul class="navbar-nav ml-auto" *ngIf="isLoggedIn">
        <li class="nav-item">
          <a href="/profile" class="nav-link custom-nav-link" routerLink="profile">{{ username }}</a>
        </li>
        <li class="nav-item">
          <a href class="nav-link custom-nav-link" (click)="logout()">Cerrar Sesion</a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <router-outlet></router-outlet>
  </div>
</div>

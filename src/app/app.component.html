<div id="app">
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #075203;">
    <a href="#" class="navbar-brand">Principal</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">

        <!-- Home -->
        <li class="nav-item">
          <a class="nav-link custom-nav-link" routerLink="/home">Home</a>
        </li>

        <!-- Administración -->
        <li class="nav-item dropdown" *ngIf="showAdminBoard">
          <a class="nav-link dropdown-toggle" href="#" id="adminDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            Administración
          </a>
          <div class="dropdown-menu" aria-labelledby="adminDropdown">
            <a class="dropdown-item" routerLink="/userlist">Usuarios</a>
            <a class="dropdown-item" routerLink="/medico-list">Médicos</a>
            <a class="dropdown-item" routerLink="/especialidadlist">Especialidad</a>
            <a class="dropdown-item" routerLink="/medico-especialidad-list">Médico-Especialidad</a>
            <a class="dropdown-item" routerLink="/antecedente-list">Antecedentes</a>
          </div>
        </li>

        <!-- Gestión Médica -->
        <li class="nav-item dropdown" *ngIf="showModeratorBoard || showAdminBoard">
          <a class="nav-link dropdown-toggle" href="#" id="gestionDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            Gestión Médica
          </a>
          <div class="dropdown-menu" aria-labelledby="gestionDropdown">
            <a class="dropdown-item" routerLink="/horario-list">Horario</a>
            <a class="dropdown-item" routerLink="/consulta-list">Consulta</a>
            <a class="dropdown-item" routerLink="/receta-list">Receta</a>
            <a class="dropdown-item" routerLink="/examen-list">Examen</a>
            <a class="dropdown-item" routerLink="/tratamiento-list">Tratamiento</a>
          </div>
        </li>

        <!-- Fichas -->
        <li class="nav-item" *ngIf="showUserBoard || showAdminBoard || showModeratorBoard">
          <a class="nav-link custom-nav-link" routerLink="/ficha-list">Ficha</a>
        </li>

        <!-- Pacientes -->
        <li class="nav-item" *ngIf="showUserBoard || showModeratorBoard || showAdminBoard">
          <a class="nav-link custom-nav-link" routerLink="/paciente-list">Pacientes</a>
        </li>

        <!-- Paciente Board -->
        <li class="nav-item" *ngIf="showUserBoard && isLoggedIn">
          <a class="nav-link custom-nav-link" routerLink="/paciente">Paciente Board</a>
        </li>
      </ul>

      <!-- Menú de Autenticación -->
      <ul class="navbar-nav ml-auto" *ngIf="!isLoggedIn">
        <li class="nav-item">
          <a class="nav-link custom-nav-link" routerLink="/register">Registrarse</a>
        </li>
        <li class="nav-item">
          <a class="nav-link custom-nav-link" routerLink="/login">Iniciar Sesión</a>
        </li>
      </ul>

      <ul class="navbar-nav ml-auto" *ngIf="isLoggedIn">
        <li class="nav-item">
          <a class="nav-link custom-nav-link" routerLink="/profile">{{ username }}</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link custom-nav-link" (click)="logout()">Cerrar Sesión</a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <router-outlet></router-outlet>
  </div>
</div>

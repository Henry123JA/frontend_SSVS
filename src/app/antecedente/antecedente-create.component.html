<div class="col-md-12">
    <div class="card card-container">
      <h2>Crear Antecedente Médico</h2>
      <form name="createForm" (ngSubmit)="f.form.valid && createAntecedente()" #f="ngForm" novalidate>
        
        <!-- Paciente Field -->
        <div class="form-group">
          <label for="paciente">Seleccionar Paciente</label>
          <select
            id="paciente"
            class="form-control"
            name="paciente"
            [(ngModel)]="antecedente.paciente.id"
            required
            #paciente="ngModel"
          >
            <option value="" disabled selected>Seleccionar Paciente</option>
            <option *ngFor="let paciente of pacientes" [value]="paciente.id">
              {{ paciente.ci }} - {{ paciente.user.username }}
            </option>
          </select>
          <div class="alert alert-danger" *ngIf="paciente.errors && f.submitted">
            <div *ngIf="paciente.errors['required']">El paciente es obligatorio.</div>
          </div>
        </div>
  
        <!-- Enfermedades Base -->
        <div class="form-group">
          <label for="enfermedadesBase">Enfermedades Base</label>
          <textarea
            id="enfermedadesBase"
            class="form-control"
            name="enfermedadesBase"
            [(ngModel)]="antecedente.enfermedadesBase"
            required
            #enfermedadesBase="ngModel"
          ></textarea>
          <div class="alert alert-danger" *ngIf="enfermedadesBase.errors && f.submitted">
            <div *ngIf="enfermedadesBase.errors['required']">Las enfermedades base son obligatorias.</div>
          </div>
        </div>
  
        <!-- Enfermedades Hereditarias -->
        <div class="form-group">
          <label for="enfermedadesHereditarias">Enfermedades Hereditarias</label>
          <textarea
            id="enfermedadesHereditarias"
            class="form-control"
            name="enfermedadesHereditarias"
            [(ngModel)]="antecedente.enfermedadesHereditarias"
            required
            #enfermedadesHereditarias="ngModel"
          ></textarea>
          <div class="alert alert-danger" *ngIf="enfermedadesHereditarias.errors && f.submitted">
            <div *ngIf="enfermedadesHereditarias.errors['required']">Las enfermedades hereditarias son obligatorias.</div>
          </div>
        </div>
  
        <!-- Otras -->
        <div class="form-group">
          <label for="otras">Otras</label>
          <textarea
            id="otras"
            class="form-control"
            name="otras"
            [(ngModel)]="antecedente.otras"
          ></textarea>
        </div>
  
        <!-- Submit Button -->
        <div class="form-group">
          <button class="btn btn-primary btn-block">Crear Antecedente</button>
          <button class="btn btn-outline-warning btn-block" routerLink="/antecedente-list">Volver</button>
        </div>
  
        <!-- Error Message -->
        <div class="alert alert-warning" *ngIf="f.submitted && isCreateFailed">
          ¡La creación falló!<br />{{ errorMessage }}
        </div>
      </form>
  
      <!-- Success Message -->
      <div class="alert alert-success" *ngIf="isSuccessful">
        ¡Antecedente creado con éxito!
      </div>
    </div>
  </div>
